<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hair Health Analyzer - Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      height: 100vh;
      justify-content: center;
    }

    h1 {
      color: #3ddc97;
      margin-bottom: 1rem;
      font-size: 3rem;
      text-align: center;
    }

    .card {
      background-color: #1c2541;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(61, 220, 151, 0.2);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    input, button {
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
    }

    input {
      background-color: #3a506b;
      color: white;
      transition: background-color 0.3s ease;
    }

    input:focus {
      background-color: #2b3a53;
    }

    button {
      background-color: #3ddc97;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #27b87a;
    }

    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      background-color: #1c2541;
      border-radius: 0.5rem;
      font-weight: bold;
      min-height: 2rem;
      text-align: center;
    }

    #analyzerSection {
      display: none;
      animation: fadeIn 1s ease-in-out;
    }

    #loading {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background-color: #1c2541;
      border-radius: 0.5rem;
      text-align: center;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3ddc97;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    #loginError {
      color: red;
      font-size: 0.9rem;
      text-align: center;
    }

    .form-container {
      max-width: 500px;
      width: 100%;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .image-preview {
      max-width: 100%;
      height: auto;
      margin-top: 1rem;
      border-radius: 0.5rem;
      border: 2px solid #3ddc97;
    }

    footer {
      margin-top: 2rem;
      color: #3ddc97;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
    }

    footer a {
      color: #3ddc97;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .card {
        width: 90%;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>Hair Health Analyzer</h1>

  <!-- Login Section -->
  <div id="loginSection" class="card">
    <h2>Login</h2>
    <div class="form-container">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button onclick="login()">Login</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- Analyzer Section -->
  <div id="analyzerSection">
    <form id="uploadForm" class="card">
      <h2>Upload your Hair Image for Analysis</h2>
      <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)" required />
      <button id="analyzeBtn">Analyze</button>
    </form>
    <img id="imagePreview" class="image-preview" />
    <div id="loading">
      <div class="loader"></div>
      <p>Analyzing...</p>
    </div>
    <div id="result"></div>
  </div>

  <footer>
    <p>Created with ❤️ by <a href="https://github.com/mgsarwar">Md Gulam Sarwar || Sunanda || shayn || suvam sekhar</a></p>
  </footer>

  <script>
    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const loginError = document.getElementById('loginError');

      if (email === '' || password === '') {
        loginError.textContent = "Please enter email and password.";
        return;
      }

      if (email === 'gulam@sarwar' && password === '1234') {
        sessionStorage.setItem('user', email);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('analyzerSection').style.display = 'block';
      } else {
        loginError.textContent = "Invalid credentials.";
      }
    }

    function previewImage(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function() {
        const imagePreview = document.getElementById('imagePreview');
        imagePreview.src = reader.result;
      }
      reader.readAsDataURL(file);
    }

    document.getElementById('analyzeBtn').addEventListener('click', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('imageInput');
      const resultDiv = document.getElementById('result');
      const loadingDiv = document.getElementById('loading');

      if (fileInput.files.length === 0) {
        resultDiv.innerText = "Please select an image.";
        return;
      }

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      // Show loading spinner
      loadingDiv.style.display = 'block';

      try {
        const res = await fetch('http://localhost:5001/analyze', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (data.density_score === undefined || data.health_status === undefined) {
          resultDiv.innerText = "Error: Response missing values.";
        } else {
          resultDiv.innerHTML = `
            <div>🧪 <strong>Density Score:</strong> ${data.density_score}%</div>
            <div>💡 <strong>Health Status:</strong> ${data.health_status}</div>
          `;
        }
      } catch (err) {
        console.error("Fetch error:", err);
        resultDiv.innerText = "Something went wrong while analyzing.";
      } finally {
        // Hide loading spinner
        loadingDiv.style.display = 'none';
      }
    });

    // Check session on load
    window.onload = () => {
      const user = sessionStorage.getItem('user');
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('analyzerSection').style.display = 'block';
      }
    };
  </script>
</body>
</html>
